<script>
// === KAIROS INVESTMENT MODULE v2.0.0 ===
/**
 * Money KAIROS AI - Investment Records Module
 * Phase 2: Transaction Recording with Historical Price Fetch
 */

(function() {
  'use strict';

  // ============================================
  // 型定義（TypeScript風コメント）
  // ============================================
  /**
   * @typedef {Object} InvestmentRecord
   * @property {string} id - ユニークID
   * @property {string} currencyId - 通貨ID (btc, eth, sol など)
   * @property {'buy' | 'sell'} type - 取引種別
   * @property {string} date - 取引日 (ISO 8601)
   * @property {number} quantity - 数量
   * @property {number|null} priceJpy - 取引時の価格（円）※予約時はnull
   * @property {number|null} totalJpy - 合計金額（円）※予約時はnull
   * @property {'confirmed' | 'scheduled'} status - 確定 or 予約
   * @property {string} [memo] - メモ（任意）
   * @property {string} createdAt - 作成日時
   * @property {string} updatedAt - 更新日時
   */

  /**
   * @typedef {Object} CurrencyHolding
   * @property {string} currencyId - 通貨ID
   * @property {number} totalQuantity - 保有数量
   * @property {number} totalInvested - 総投資額（円）
   * @property {number} averageCost - 平均取得単価
   * @property {number} totalSold - 総売却額（円）
   * @property {number} realizedPnl - 確定損益（円）
   */

  // ============================================
  // Constants
  // ============================================
  const STORAGE_KEY = 'kairos_investment_records';
  const VERSION = '2.0.0';

  // CoinGecko API for historical prices
  const COINGECKO_API = 'https://api.coingecko.com/api/v3';
  
  // 通貨IDマッピング（KAIROS ID → CoinGecko ID）
  const CURRENCY_MAP = {
    btc: 'bitcoin',
    eth: 'ethereum',
    sol: 'solana',
    xrp: 'ripple',
    ada: 'cardano',
    dot: 'polkadot',
    avax: 'avalanche-2',
    matic: 'matic-network',
    link: 'chainlink',
    atom: 'cosmos',
    uni: 'uniswap',
    ltc: 'litecoin',
    doge: 'dogecoin',
    shib: 'shiba-inu'
  };

  // ============================================
  // Historical Price API
  // ============================================
  const PriceAPI = {
    /**
     * 過去の日付の価格を取得（CoinGecko）
     * @param {string} currencyId - KAIROS通貨ID (btc, eth, etc)
     * @param {Date|string} date - 取得したい日付
     * @returns {Promise<number|null>} - 価格（JPY）またはnull
     */
    getHistoricalPrice: async function(currencyId, date) {
      try {
        const coinId = CURRENCY_MAP[currencyId.toLowerCase()];
        if (!coinId) {
          console.error('[KAIROS] Unknown currency:', currencyId);
          return null;
        }

        const targetDate = new Date(date);
        const dateStr = [
          String(targetDate.getDate()).padStart(2, '0'),
          String(targetDate.getMonth() + 1).padStart(2, '0'),
          targetDate.getFullYear()
        ].join('-'); // dd-mm-yyyy format

        const url = `${COINGECKO_API}/coins/${coinId}/history?date=${dateStr}&localization=false`;
        console.log('[KAIROS] Fetching historical price:', url);

        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`API error: ${response.status}`);
        }

        const data = await response.json();
        const priceJpy = data.market_data?.current_price?.jpy;

        if (priceJpy === undefined) {
          console.warn('[KAIROS] No JPY price data for', currencyId, 'on', dateStr);
          return null;
        }

        console.log('[KAIROS] Historical price:', currencyId, dateStr, '=', priceJpy, 'JPY');
        return priceJpy;
      } catch (e) {
        console.error('[KAIROS] Historical price fetch error:', e);
        return null;
      }
    },

    /**
     * 現在の価格を取得
     * @param {string} currencyId
     * @returns {Promise<number|null>}
     */
    getCurrentPrice: async function(currencyId) {
      try {
        const coinId = CURRENCY_MAP[currencyId.toLowerCase()];
        if (!coinId) return null;

        const url = `${COINGECKO_API}/simple/price?ids=${coinId}&vs_currencies=jpy`;
        const response = await fetch(url);
        const data = await response.json();

        return data[coinId]?.jpy || null;
      } catch (e) {
        console.error('[KAIROS] Current price fetch error:', e);
        return null;
      }
    },

    /**
     * 日付が今日か過去かを判定
     * @param {Date|string} date
     * @returns {'past' | 'today' | 'future'}
     */
    getDateType: function(date) {
      const target = new Date(date);
      const today = new Date();

      // 時間部分を除去して日付のみで比較
      target.setHours(0, 0, 0, 0);
      today.setHours(0, 0, 0, 0);

      if (target.getTime() < today.getTime()) return 'past';
      if (target.getTime() > today.getTime()) return 'future';
      return 'today';
    },

    /**
     * 日付に応じた価格を取得（統一ヘルパー）
     * @param {string} currencyId
     * @param {Date|string} date
     * @returns {Promise<number|null>}
     */
    fetchPriceByDate: async function(currencyId, date) {
      const dateType = this.getDateType(date);
      if (dateType === 'today') {
        return await this.getCurrentPrice(currencyId);
      } else if (dateType === 'past') {
        return await this.getHistoricalPrice(currencyId, date);
      }
      return null; // future
    }
  };

  // ============================================
  // Storage Manager
  // ============================================
  const StorageManager = {
    /**
     * localStorage から投資履歴を読み込み
     * @returns {InvestmentRecord[]}
     */
    load: function() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (!data) return [];
        
        const parsed = JSON.parse(data);
        // バージョンチェック & マイグレーション
        if (parsed.version !== VERSION) {
          return this.migrate(parsed);
        }
        return parsed.records || [];
      } catch (e) {
        console.error('[KAIROS Investment] Load error:', e);
        return [];
      }
    },

    /**
     * localStorage に投資履歴を保存
     * @param {InvestmentRecord[]} records
     */
    save: function(records) {
      try {
        const data = {
          version: VERSION,
          records: records,
          updatedAt: new Date().toISOString()
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch (e) {
        console.error('[KAIROS Investment] Save error:', e);
        return false;
      }
    },

    /**
     * データマイグレーション（将来のバージョン変更に対応）
     */
    migrate: function(data) {
      // v1.0.0では特にマイグレーション処理なし
      return data.records || [];
    },

    /**
     * 全データをクリア
     */
    clear: function() {
      localStorage.removeItem(STORAGE_KEY);
    },

    /**
     * データをエクスポート（JSON）
     */
    exportJSON: function() {
      const records = this.load();
      return JSON.stringify({
        exportedAt: new Date().toISOString(),
        version: VERSION,
        records: records
      }, null, 2);
    },

    /**
     * データをインポート
     */
    importJSON: function(jsonString) {
      try {
        const data = JSON.parse(jsonString);
        if (!Array.isArray(data.records)) {
          throw new Error('Invalid data format');
        }
        this.save(data.records);
        return true;
      } catch (e) {
        console.error('[KAIROS Investment] Import error:', e);
        return false;
      }
    }
  };

  // ============================================
  // Investment Record Manager
  // ============================================
  const InvestmentManager = {
    _records: [],
    _listeners: [],

    /**
     * 初期化
     */
    init: function() {
      this._records = StorageManager.load();
      console.log('[KAIROS Investment] Loaded', this._records.length, 'records');
      return this;
    },

    /**
     * 変更リスナーを登録
     */
    subscribe: function(callback) {
      this._listeners.push(callback);
      return () => {
        this._listeners = this._listeners.filter(l => l !== callback);
      };
    },

    /**
     * リスナーに通知
     */
    _notify: function() {
      this._listeners.forEach(l => l(this._records));
    },

    /**
     * ユニークID生成
     */
    _generateId: function() {
      return 'inv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    },

    /**
     * 取引記録を追加（共通処理）
     * @param {string} type - 'buy' または 'sell'
     * @param {Object} data - { currencyId, date, quantity, memo }
     * @returns {Promise<InvestmentRecord>}
     */
    _addRecord: async function(type, data) {
      const targetDate = data.date ? new Date(data.date) : new Date();
      const dateType = PriceAPI.getDateType(targetDate);

      let priceJpy = null;
      let totalJpy = null;
      let status = 'confirmed';

      if (dateType === 'future') {
        status = 'scheduled';
      } else {
        priceJpy = await PriceAPI.fetchPriceByDate(data.currencyId, targetDate);
        if (priceJpy !== null) {
          totalJpy = Number(data.quantity) * priceJpy;
        }
      }

      const record = {
        id: this._generateId(),
        currencyId: data.currencyId,
        type: type,
        date: targetDate.toISOString(),
        quantity: Number(data.quantity),
        priceJpy: priceJpy,
        totalJpy: totalJpy,
        status: status,
        memo: data.memo || '',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      this._records.push(record);
      StorageManager.save(this._records);
      this._notify();
      return record;
    },

    /**
     * 購入記録を追加
     */
    addBuyRecord: async function(data) {
      return this._addRecord('buy', data);
    },

    /**
     * 売却記録を追加
     */
    addSellRecord: async function(data) {
      return this._addRecord('sell', data);
    },

    /**
     * 記録を更新
     */
    updateRecord: function(id, updates) {
      const index = this._records.findIndex(r => r.id === id);
      if (index === -1) return null;
      
      this._records[index] = {
        ...this._records[index],
        ...updates,
        updatedAt: new Date().toISOString()
      };
      
      StorageManager.save(this._records);
      this._notify();
      return this._records[index];
    },

    /**
     * 記録を削除
     */
    deleteRecord: function(id) {
      const index = this._records.findIndex(r => r.id === id);
      if (index === -1) return false;
      
      this._records.splice(index, 1);
      StorageManager.save(this._records);
      this._notify();
      return true;
    },

    /**
     * 全記録を取得
     */
    getAllRecords: function() {
      return [...this._records];
    },

    /**
     * 通貨IDで記録をフィルタ
     */
    getRecordsByCurrency: function(currencyId) {
      return this._records.filter(r => r.currencyId === currencyId);
    },

    /**
     * 期間でフィルタ
     */
    getRecordsByDateRange: function(startDate, endDate) {
      const start = new Date(startDate).getTime();
      const end = new Date(endDate).getTime();
      return this._records.filter(r => {
        const date = new Date(r.date).getTime();
        return date >= start && date <= end;
      });
    },

    /**
     * 今年の記録を取得
     */
    getCurrentYearRecords: function() {
      const year = new Date().getFullYear();
      const start = new Date(year, 0, 1).toISOString();
      const end = new Date(year, 11, 31, 23, 59, 59).toISOString();
      return this.getRecordsByDateRange(start, end);
    },

    /**
     * 今月の記録を取得
     */
    getCurrentMonthRecords: function() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
      const end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59).toISOString();
      return this.getRecordsByDateRange(start, end);
    },

    /**
     * 予約記録を確定に変換（日付が来たら実行）
     * @param {string} id - レコードID
     * @returns {Promise<InvestmentRecord|null>}
     */
    confirmScheduledRecord: async function(id) {
      const record = this._records.find(r => r.id === id);
      if (!record || record.status !== 'scheduled') return null;

      const priceJpy = await PriceAPI.fetchPriceByDate(record.currencyId, record.date);
      if (priceJpy === null) {
        console.log('[KAIROS] Cannot confirm record - price unavailable or future date');
        return null;
      }

      return this.updateRecord(id, {
        priceJpy: priceJpy,
        totalJpy: record.quantity * priceJpy,
        status: 'confirmed'
      });
    },

    /**
     * 全ての期限切れ予約を確定
     */
    confirmAllDueScheduled: async function() {
      const scheduled = this._records.filter(r => r.status === 'scheduled');
      const results = [];

      for (const record of scheduled) {
        const dateType = PriceAPI.getDateType(record.date);
        if (dateType !== 'future') {
          const confirmed = await this.confirmScheduledRecord(record.id);
          if (confirmed) results.push(confirmed);
        }
      }

      return results;
    },

    /**
     * 予約中の記録を取得
     */
    getScheduledRecords: function() {
      return this._records.filter(r => r.status === 'scheduled');
    },

    /**
     * 確定済みの記録のみ取得
     */
    getConfirmedRecords: function() {
      return this._records.filter(r => r.status === 'confirmed');
    }
  };

  // ============================================
  // Calculation Helpers
  // ============================================
  const InvestmentCalculator = {
    /**
     * 通貨ごとの保有状況を計算
     * @param {string} currencyId
     * @param {InvestmentRecord[]} records
     * @returns {CurrencyHolding}
     */
    calculateHolding: function(currencyId, records) {
      const filtered = records.filter(r => r.currencyId === currencyId);
      
      let totalQuantity = 0;
      let totalInvested = 0;
      let totalSold = 0;
      let soldQuantity = 0;
      
      // 購入記録を処理
      filtered.filter(r => r.type === 'buy').forEach(r => {
        totalQuantity += r.quantity;
        totalInvested += r.totalJpy;
      });
      
      // 売却記録を処理
      filtered.filter(r => r.type === 'sell').forEach(r => {
        soldQuantity += r.quantity;
        totalSold += r.totalJpy;
      });
      
      // 残り数量
      const remainingQuantity = totalQuantity - soldQuantity;
      
      // 平均取得単価
      const averageCost = totalQuantity > 0 ? totalInvested / totalQuantity : 0;
      
      // 確定損益（売却額 - 売却分の平均取得コスト）
      const realizedPnl = totalSold - (averageCost * soldQuantity);
      
      return {
        currencyId: currencyId,
        totalQuantity: remainingQuantity,
        totalInvested: totalInvested,
        averageCost: averageCost,
        totalSold: totalSold,
        realizedPnl: realizedPnl
      };
    },

    /**
     * 全通貨の保有状況を計算
     * @param {InvestmentRecord[]} records
     * @returns {Object.<string, CurrencyHolding>}
     */
    calculateAllHoldings: function(records) {
      const currencyIds = [...new Set(records.map(r => r.currencyId))];
      const holdings = {};
      
      currencyIds.forEach(id => {
        holdings[id] = this.calculateHolding(id, records);
      });
      
      return holdings;
    },

    /**
     * 年間確定損益を計算（確定申告用）
     */
    calculateYearlyRealizedPnl: function(records, year) {
      const yearRecords = records.filter(r => {
        const recordYear = new Date(r.date).getFullYear();
        return recordYear === year;
      });
      
      const holdings = this.calculateAllHoldings(yearRecords);
      let totalRealizedPnl = 0;
      
      Object.values(holdings).forEach(h => {
        totalRealizedPnl += h.realizedPnl;
      });
      
      return totalRealizedPnl;
    },

    /**
     * 今月の投資額を計算
     */
    calculateMonthlyInvested: function(records) {
      const now = new Date();
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      
      return records
        .filter(r => r.type === 'buy' && new Date(r.date) >= startOfMonth)
        .reduce((sum, r) => sum + r.totalJpy, 0);
    }
  };

  // ============================================
  // サマリーデータ生成
  // ============================================
  const InvestmentSummary = {
    /**
     * ホーム画面用のサマリーデータを生成
     * @param {InvestmentRecord[]} records
     * @param {Object} currentPrices - { btc: 15000000, eth: 500000, ... }
     */
    generateHomeSummary: function(records, currentPrices) {
      const holdings = InvestmentCalculator.calculateAllHoldings(records);
      const currentYear = new Date().getFullYear();
      
      let totalInvested = 0;
      let currentValue = 0;
      let totalRealizedPnl = 0;
      
      Object.keys(holdings).forEach(currencyId => {
        const holding = holdings[currencyId];
        totalInvested += holding.totalInvested;
        totalRealizedPnl += holding.realizedPnl;
        
        const price = currentPrices[currencyId] || 0;
        currentValue += holding.totalQuantity * price;
      });
      
      const monthlyInvested = InvestmentCalculator.calculateMonthlyInvested(records);
      const yearlyRealizedPnl = InvestmentCalculator.calculateYearlyRealizedPnl(records, currentYear);

      return {
        totalInvested: totalInvested,
        monthlyInvested: monthlyInvested,
        currentValue: currentValue,
        unrealizedPnl: currentValue - totalInvested + totalRealizedPnl,
        realizedPnl: totalRealizedPnl,
        yearlyRealizedPnl: yearlyRealizedPnl,
        holdings: holdings,
        currencyCount: Object.keys(holdings).filter(k => holdings[k].totalQuantity > 0).length
      };
    }
  };

  // ============================================
  // グローバルに公開（統一名前空間）
  // ============================================
  window.KAIROS = window.KAIROS || {};
  window.KAIROS.Investment = {
    VERSION: VERSION,
    Manager: InvestmentManager.init(),
    Calculator: InvestmentCalculator,
    Summary: InvestmentSummary,
    Storage: StorageManager,
    PriceAPI: PriceAPI
  };

  // 後方互換性のためのエイリアス
  window.KairosInvestment = window.KAIROS.Investment;

  // 起動時に期限切れ予約を確定
  InvestmentManager.confirmAllDueScheduled().then(confirmed => {
    if (confirmed.length > 0) {
      console.log('[KAIROS] Confirmed', confirmed.length, 'scheduled records');
    }
  });

  console.log('[KAIROS] Investment Module v' + VERSION + ' loaded');
})();

    }

    loadKeys() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.API_KEYS) || '{}');
      } catch {
        return {};
      }
    }

    loadPriorities() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.API_PRIORITIES) || '{}');
      } catch {
        return {};
      }
    }

    saveKeys(keys) {
      this.keys = keys;
      localStorage.setItem(STORAGE_KEYS.API_KEYS, JSON.stringify(keys));
    }

    savePriorities(priorities) {
      this.priorities = priorities;
      localStorage.setItem(STORAGE_KEYS.API_PRIORITIES, JSON.stringify(priorities));
    }

    // カテゴリ内の有効なAPI一覧を取得
    getActiveAPIs(category) {
      const cat = API_CATEGORIES[category];
      if (!cat) return [];

      const active = [];
      const priorities = this.priorities[category] || [];

      for (const provider of cat.providers) {
        if (provider.noKey || this.keys[provider.id]) {
          active.push({
            ...provider,
            priority: priorities.indexOf(provider.id)
          });
        }
      }

      // 優先順位でソート
      return active.sort((a, b) => {
        if (a.priority === -1) return 1;
        if (b.priority === -1) return -1;
        return a.priority - b.priority;
      });
    }

    getCategoryMode(category) {
      const active = this.getActiveAPIs(category);
      const cat = API_CATEGORIES[category];

      if (active.length === 0) return { mode: 'disabled', apis: [] };
      if (active.length === 1) return { mode: 'single', apis: active };

      return {
        mode: cat.multiMode,
        apis: active,
        description: this.getModeDescription(cat.multiMode, active.length)
      };
    }

    getModeDescription(mode, count) {
      switch (mode) {
        case 'select': return `${count}つから選択`;
        case 'fallback': return `${count}つでフォールバック`;
        case 'combine': return `${count}つで補完・クロスチェック`;
        default: return '';

    calculateCapability() {
      let score = 0;
      const details = {};

      for (const [catId, cat] of Object.entries(API_CATEGORIES)) {
        const active = this.getActiveAPIs(catId);
        const catScore = Math.min(active.length * 10, 20); // 最大20点/カテゴリ

        details[catId] = {
          count: active.length,
          score: catScore,
          apis: active.map(a => a.name)
        };
      }

      // 最大100点に正規化
      score = Math.min(Math.round(score * 100 / 120), 100);

      let mode, color;
      if (score >= 80) { mode = 'フルパワー'; color = '#22c55e'; }
      else if (score >= 60) { mode = 'プロフェッショナル'; color = '#3b82f6'; }
      else if (score >= 40) { mode = 'スタンダード'; color = '#8b5cf6'; }
      else if (score >= 20) { mode = 'ベーシック'; color = '#f59e0b'; }
      else { mode = 'ミニマル'; color = '#6b7280'; }

      return { score, mode, color, details };
    }

<script>
// ============================================
// KAIROS Python Backend API v1.0
// ============================================
// Python バックエンドとの連携モジュール
// サーバー: http://localhost:8000
// ============================================

(function() {
  'use strict';

  const BACKEND_URL = 'http://localhost:8000';

  class KairosBackendAPI {
    constructor() {
      this.baseUrl = BACKEND_URL;
      this.cache = {};
      this.cacheTTL = 5 * 60 * 1000; // 5分
    }

    // ヘルスチェック
    async healthCheck() {
      try {
        const response = await fetch(`${this.baseUrl}/`);
        return response.ok;
      } catch (e) {
        console.warn('[KAIROS Backend] Server not available:', e.message);
        // フォールバック: kairosDataがあればtrue
        if (window.kairosData) {
          console.log('[KAIROS Backend] Using kairosData as fallback');
          return true;
        }
        return false;
      }
    }

    // 通貨分析
    async analyzeCurrency(currencyId) {
      const cacheKey = `analyze_${currencyId}`;
      const cached = this._getCache(cacheKey);
      if (cached) return cached;

      try {
        const response = await fetch(`${this.baseUrl}/api/analyze/${currencyId}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        this._setCache(cacheKey, data);
        return data;
      } catch (e) {
        console.error('[KAIROS Backend] Analyze error:', e);
        // フォールバック: window.kairosDataから読み込む
        if (window.kairosData) {
          const upperCurrency = currencyId.toUpperCase();
          // all_resultsから該当通貨を探す
          if (window.kairosData.all_results) {
            const found = window.kairosData.all_results.find(r => r.ticker === upperCurrency);
            if (found) {
              console.log('[KAIROS Backend] Using kairosData fallback for:', upperCurrency);
              this._setCache(cacheKey, found);
              return found;
            }
          }
          // 単一通貨の場合
          if (window.kairosData.ticker === upperCurrency) {
            console.log('[KAIROS Backend] Using kairosData fallback for:', upperCurrency);
            this._setCache(cacheKey, window.kairosData);
            return window.kairosData;
          }
        }
        return null;
      }
    }

    // 月次積立提案
    async getMonthlySuggestion(budget, currentHoldings = null) {
      try {
        const response = await fetch(`${this.baseUrl}/api/monthly-suggestion`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ budget, current_holdings: currentHoldings })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (e) {
        console.error('[KAIROS Backend] Monthly suggestion error:', e);
        return null;
      }
    }

    // スイングシグナル
    async getSwingSignals(currencyId) {
      try {
        const response = await fetch(`${this.baseUrl}/api/swing/${currencyId}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (e) {
        console.error('[KAIROS Backend] Swing signal error:', e);
        return null;
      }
    }

    // ポートフォリオルール取得
    async getPortfolioRules() {
      try {
        const response = await fetch(`${this.baseUrl}/api/rules`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (e) {
        console.error('[KAIROS Backend] Rules error:', e);
        return null;
      }
    }

    // キャッシュ管理
    _getCache(key) {
      const cached = this.cache[key];
      if (cached && Date.now() - cached.timestamp < this.cacheTTL) {
        return cached.data;
      }
      delete this.cache[key];
      return null;
    }

    _setCache(key, data) {
      this.cache[key] = { data, timestamp: Date.now() };
    }

    clearCache() {
      this.cache = {};
    }
  }

  // グローバルに公開
  window.KAIROS = window.KAIROS || {};
  window.KAIROS.Backend = new KairosBackendAPI();

  // 初期化時にサーバー接続確認
  window.KAIROS.Backend.healthCheck().then(available => {
    if (available) {
      console.log('[KAIROS] Python Backend connected');
    } else {
      console.log('[KAIROS] Python Backend not available (using client-side fallback)');
    }
  });

})();

</script>

    observer.observe(document.body, { childList: true, subtree: true });

    function enhanceAPISettings(container) {
      container.dataset.kairosEnhanced = 'true';
      
      const manager = window.KairosAPIManager;
      const categories = window.API_CATEGORIES;
      
      if (!manager || !categories) {
        console.warn('[KAIROS] API System not loaded');
        return;
      }

      // 元のコンテンツをクリア
      container.innerHTML = '';
      
      // 説明文
      const desc = document.createElement('p');
      desc.className = 'api-key-settings__description';
      desc.textContent = 'APIを設定すると分析機能が強化されます。同じカテゴリで複数設定するとフォールバック・補完が有効になります。';
      container.appendChild(desc);

      // 能力診断カード
      const capCard = createCapabilityCard(manager);
      container.appendChild(capCard);

      // カテゴリ別セクション
      for (const [catId, cat] of Object.entries(categories)) {
        const section = createCategorySection(catId, cat, manager);
        container.appendChild(section);
      }

      // 保存ボタン
      const saveBtn = document.createElement('button');
      saveBtn.className = 'api-key-settings__save';
      saveBtn.textContent = '保存する';
      saveBtn.onclick = function() {
        saveAllSettings(container, manager);
        saveBtn.textContent = '✓ 保存しました';
        saveBtn.classList.add('api-key-settings__save--saved');
        setTimeout(() => {
          saveBtn.textContent = '保存する';
          saveBtn.classList.remove('api-key-settings__save--saved');
        }, 2000);
      };
      container.appendChild(saveBtn);

      // 注意書き
      const note = document.createElement('div');
      note.className = 'api-key-settings__note';
      note.innerHTML = '<span class="api-key-settings__note-icon">🔒</span><p class="api-key-settings__note-text">APIキーは端末内に保存され、外部に送信されることはありません。</p>';
      container.appendChild(note);
    }

    function createCapabilityCard(manager) {
      const cap = manager.calculateCapability();
      
      const card = document.createElement('div');
      card.className = 'kairos-capability-card';
      card.id = 'kairos-capability-card';
      
      card.innerHTML = `
        <div class="kairos-capability-header">
          <span class="kairos-capability-mode" style="color: ${cap.color}">${cap.mode}モード</span>
          <span class="kairos-capability-score">${cap.score}%</span>
        </div>
        <div class="kairos-capability-bar">
          <div class="kairos-capability-bar-fill" style="width: ${cap.score}%; background: linear-gradient(90deg, ${cap.color}, ${cap.color}88);"></div>
        </div>
        <div class="kairos-capability-details">
          ${Object.entries(cap.details).map(([catId, detail]) => `
            <div class="kairos-capability-item">
              <div class="kairos-capability-item-icon">${window.API_CATEGORIES[catId]?.icon || '📊'}</div>
              <div class="kairos-capability-item-count">${detail.count}</div>
              <div class="kairos-capability-item-name">${window.API_CATEGORIES[catId]?.name || catId}</div>
            </div>
          `).join('')}
        </div>
      `;
      
      return card;
    }

    function createCategorySection(catId, cat, manager) {
      const active = manager.getActiveAPIs(catId);
      const mode = manager.getCategoryMode(catId);
      
      const section = document.createElement('div');
      section.className = 'kairos-api-category';
      section.dataset.category = catId;
      
      // 最初のカテゴリ（AI）は開いておく
      if (catId === 'ai') section.classList.add('open');
      
      section.innerHTML = `
        <div class="kairos-api-category-header">
          <span class="kairos-api-category-icon">${cat.icon}</span>
          <div class="kairos-api-category-info">
            <div class="kairos-api-category-name">${cat.name}</div>
            <div class="kairos-api-category-desc">${cat.description}</div>
          </div>
          <span class="kairos-api-category-badge ${active.length === 0 ? 'inactive' : ''}">${active.length}個設定</span>
          <span class="kairos-api-category-arrow">▼</span>
        </div>
        <div class="kairos-api-category-content">
          ${active.length > 1 ? `<div class="kairos-api-mode-badge">🔄 ${mode.description}</div>` : ''}
          ${cat.providers.map((provider, idx) => {
            const hasKey = provider.noKey || manager.keys[provider.id];
            const isRecommended = provider.description.includes('推奨');
            const priority = active.findIndex(a => a.id === provider.id);
            
            return `
              <div class="kairos-api-provider ${hasKey ? 'active' : ''}" data-provider="${provider.id}">
                <span class="kairos-api-provider-icon">${provider.icon}</span>
                <div class="kairos-api-provider-content">
                  <div class="kairos-api-provider-header">
                    <span class="kairos-api-provider-name">${provider.name}</span>
                    ${provider.free ? '<span class="kairos-api-provider-tag free">無料</span>' : ''}
                    ${isRecommended ? '<span class="kairos-api-provider-tag recommended">推奨</span>' : ''}
                    ${priority >= 0 && active.length > 1 ? `<span class="kairos-api-provider-tag priority">${priority + 1}番目</span>` : ''}
                  </div>
                  <div class="kairos-api-provider-desc">${provider.description}</div>
                  ${provider.noKey 
                    ? '<span class="kairos-api-provider-nokey">✓ APIキー不要で利用可能</span>'
                    : `<input type="password" 
                        class="kairos-api-provider-input ${manager.keys[provider.id] ? 'has-value' : ''}" 
                        placeholder="${provider.placeholder}"
                        data-provider-id="${provider.id}"
                        value="${manager.keys[provider.id] || ''}"
                      >`
                  }
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
      
      // 折りたたみ切り替え
      section.querySelector('.kairos-api-category-header').onclick = function() {
        section.classList.toggle('open');
      };
      
      // 入力変更時の処理
      section.querySelectorAll('.kairos-api-provider-input').forEach(input => {
        input.oninput = function() {
          const provider = this.closest('.kairos-api-provider');
          if (this.value) {
            this.classList.add('has-value');
            provider.classList.add('active');
          } else {
            this.classList.remove('has-value');
            provider.classList.remove('active');
          }
          updateCapabilityPreview();
          updateCategoryBadge(section, catId);
        };
      });
      
      return section;
    }

    function updateCategoryBadge(section, catId) {
      const inputs = section.querySelectorAll('.kairos-api-provider-input');
      const cat = window.API_CATEGORIES[catId];
      let count = 0;
      
      // noKeyのものをカウント
      cat.providers.forEach(p => {
        if (p.noKey) count++;
      });
      
      // 入力済みのものをカウント
      inputs.forEach(input => {
        if (input.value) count++;
      });
      
      const badge = section.querySelector('.kairos-api-category-badge');
      badge.textContent = `${count}個設定`;
      badge.classList.toggle('inactive', count === 0);
    }

    function updateCapabilityPreview() {
      // 一時的なキーオブジェクトを作成
      const tempKeys = {};
      document.querySelectorAll('.kairos-api-provider-input').forEach(input => {
        if (input.value) {
          tempKeys[input.dataset.providerId] = input.value;
        }
      });
      
      // 一時的にマネージャーのキーを更新
      const manager = window.KairosAPIManager;
      const originalKeys = manager.keys;
      manager.keys = tempKeys;
      
      const cap = manager.calculateCapability();
      
      // UIを更新
      const card = document.getElementById('kairos-capability-card');
      if (card) {
        card.querySelector('.kairos-capability-mode').textContent = cap.mode + 'モード';
        card.querySelector('.kairos-capability-mode').style.color = cap.color;
        card.querySelector('.kairos-capability-score').textContent = cap.score + '%';
        card.querySelector('.kairos-capability-bar-fill').style.width = cap.score + '%';
        card.querySelector('.kairos-capability-bar-fill').style.background = `linear-gradient(90deg, ${cap.color}, ${cap.color}88)`;
        
        // 詳細も更新
        const details = card.querySelector('.kairos-capability-details');
        details.innerHTML = Object.entries(cap.details).map(([catId, detail]) => `
          <div class="kairos-capability-item">
            <div class="kairos-capability-item-icon">${window.API_CATEGORIES[catId]?.icon || '📊'}</div>
            <div class="kairos-capability-item-count">${detail.count}</div>
            <div class="kairos-capability-item-name">${window.API_CATEGORIES[catId]?.name || catId}</div>
          </div>
        `).join('');
      }
      
      // 元に戻す
      manager.keys = originalKeys;
    }

    function saveAllSettings(container, manager) {
      const keys = {};
      
      container.querySelectorAll('.kairos-api-provider-input').forEach(input => {
        if (input.value) {
          keys[input.dataset.providerId] = input.value;
        }
      });
      
      manager.saveKeys(keys);
      
      // 優先順位を保存（現在の表示順）
      const priorities = {};
      for (const [catId, cat] of Object.entries(window.API_CATEGORIES)) {
        const active = [];
        cat.providers.forEach(p => {
          if (p.noKey || keys[p.id]) {
            active.push(p.id);
          }
        });
        priorities[catId] = active;
      }
      manager.savePriorities(priorities);
      
      console.log('[KAIROS] Settings saved:', { keys: Object.keys(keys).length, priorities });
    }

    console.log('[KAIROS] API Settings UI v3.0 loaded');
  });

})();

</script>

(function() {

    style.textContent = '.invest-modal-overlay { display: none !important; }';
    document.head.appendChild(style);
    
    var modalHTML = `

              <input type="date" id="tx-date" style="flex:2; padding:14px; border-radius:12px; border:1px solid #333; background:#222; color:white; font-size:16px;">
              <input type="time" id="tx-time" style="flex:1; padding:14px; border-radius:12px; border:1px solid #333; background:#222; color:white; font-size:16px;">
            </div>
          </div>
          
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; color:#888; margin-bottom:8px;">数量</label>
            <input type="number" id="tx-quantity" placeholder="0.001" step="any" style="width:100%; padding:14px; border-radius:12px; border:1px solid #333; background:#222; color:white; font-size:16px; box-sizing:border-box;">
          </div>
          
          <div style="margin-bottom:16px;">
            <label style="display:block; font-size:13px; color:#888; margin-bottom:8px;">メモ（任意）</label>
            <input type="text" id="tx-memo" placeholder="例: BitFlyerで購入" style="width:100%; padding:14px; border-radius:12px; border:1px solid #333; background:#222; color:white; font-size:16px; box-sizing:border-box;">
          </div>
          
          <div style="background:#222; border-radius:12px; padding:16px; margin-bottom:20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
              <span style="color:#888;">通貨</span>
              <span id="tx-currency">BTC</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
              <span style="color:#888;">価格取得</span>
              <span id="tx-price-status" style="color:#22c55e;">日時選択で自動取得</span>
            </div>
          </div>
          
          <button id="tx-submit" style="width:100%; padding:16px; border-radius:12px; border:none; background:#22c55e; color:white; font-size:16px; font-weight:600;">購入を記録</button>
        </div>
      </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHTML);
    
    var overlay = document.getElementById('tx-modal-overlay');
    var closeBtn = document.getElementById('tx-modal-close');
    var buyBtn = document.getElementById('tx-type-buy');
    var sellBtn = document.getElementById('tx-type-sell');
    var submitBtn = document.getElementById('tx-submit');
    var currencySpan = document.getElementById('tx-currency');
    var dateInput = document.getElementById('tx-date');
    var timeInput = document.getElementById('tx-time');
    
    var now = new Date();
    dateInput.value = now.toISOString().split('T')[0];
    timeInput.value = now.toTimeString().slice(0,5);
    
    var currentType = 'buy';
    var currentCurrency = 'BTC';

    // モーダルを開く関数（統一名前空間）
    window.KAIROS = window.KAIROS || {};
    window.KAIROS.openTxModal = function(currency) {
      currentCurrency = currency || 'BTC';
      currencySpan.textContent = currentCurrency;
      overlay.style.display = 'flex';
      document.getElementById('tx-quantity').value = '';
      document.getElementById('tx-memo').value = '';
      var now = new Date();
      dateInput.value = now.toISOString().split('T')[0];
      timeInput.value = now.toTimeString().slice(0,5);
      currentType = 'buy';
      buyBtn.style.background = '#22c55e';
      buyBtn.style.color = 'white';
      sellBtn.style.background = '#333';
      sellBtn.style.color = '#888';
      submitBtn.textContent = '購入を記録';
      submitBtn.style.background = '#22c55e';
    };
    // 後方互換性のためのエイリアス
    window.openTxModal = window.KAIROS.openTxModal;

    closeBtn.onclick = function() { overlay.style.display = 'none'; };
    overlay.onclick = function(e) { if (e.target === overlay) overlay.style.display = 'none'; };
    
    buyBtn.onclick = function() {
      currentType = 'buy';
      buyBtn.style.background = '#22c55e'; buyBtn.style.color = 'white';
      sellBtn.style.background = '#333'; sellBtn.style.color = '#888';
      submitBtn.textContent = '購入を記録'; submitBtn.style.background = '#22c55e';
    };
    
    sellBtn.onclick = function() {
      currentType = 'sell';
      sellBtn.style.background = '#ef4444'; sellBtn.style.color = 'white';
      buyBtn.style.background = '#333'; buyBtn.style.color = '#888';
      submitBtn.textContent = '売却を記録'; submitBtn.style.background = '#ef4444';
    };
    
    submitBtn.onclick = async function() {
      var quantity = document.getElementById('tx-quantity').value;
      if (!quantity || parseFloat(quantity) <= 0) { alert('数量を入力してください'); return; }

      // ボタンを無効化（二重送信防止）
      submitBtn.disabled = true;
      submitBtn.textContent = '処理中...';

      try {
        // KairosInvestment APIを使用（データ統一）
        var recordData = {
          currencyId: currentCurrency.toLowerCase(),
          date: dateInput.value + 'T' + timeInput.value + ':00',
          quantity: parseFloat(quantity),
          memo: document.getElementById('tx-memo').value || ''
        };

        var result;
        if (currentType === 'buy') {
          result = await window.KairosInvestment.Manager.addBuyRecord(recordData);
        } else {
          result = await window.KairosInvestment.Manager.addSellRecord(recordData);
        }

        if (result) {
          var priceInfo = result.priceJpy ? '\n価格: ¥' + result.priceJpy.toLocaleString() : '';
          alert('記録しました！\n\n' + (currentType === 'buy' ? '購入' : '売却') + ': ' + currentCurrency + '\n日時: ' + dateInput.value + ' ' + timeInput.value + '\n数量: ' + quantity + priceInfo);
        } else {
          alert('記録に失敗しました。');
        }
      } catch (e) {
        console.error('[KAIROS] Transaction error:', e);
        alert('エラーが発生しました: ' + e.message);
      } finally {
        // ボタンを復元
        submitBtn.disabled = false;
        submitBtn.textContent = (currentType === 'buy' ? '購入' : '売却') + 'を記録';
        overlay.style.display = 'none';
      }
    };

    // ボタンテキストを更新する関数
    function updateInvestButton(btn) {
      if (btn && btn.textContent !== '取引を記録') {
        btn.textContent = '取引を記録';
        btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
      }
    }

    // MutationObserverでボタン追加を監視（デバウンス付き）
    var debounceTimer = null;
    var buttonObserver = new MutationObserver(function(mutations) {
      // 連続した変更をまとめて処理（パフォーマンス向上）
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function() {
        var btn = document.querySelector('.detail__invest-btn');
        if (btn) updateInvestButton(btn);
      }, 100);
    });
    buttonObserver.observe(document.body, { childList: true, subtree: true });

    // 初回チェック
    var initialBtn = document.querySelector('.detail__invest-btn');
    if (initialBtn) updateInvestButton(initialBtn);

    document.addEventListener('click', function(e) {
      var btn = e.target.closest('.detail__invest-btn');
      if (btn && btn.textContent === '取引を記録') {
        e.stopPropagation(); e.preventDefault();
        var symbol = document.querySelector('.detail__currency-name-compact');
        window.KAIROS.openTxModal(symbol ? symbol.textContent.trim() : 'BTC');
        return false;
      }
    }, true);

    console.log('[KAIROS] Transaction modal loaded');
  });
})();

</script>

  function updatePresetButtons() {
    document.querySelectorAll('.kairos-dca-preset').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.amount) === currentBudget);
    });

  // ============================================
  // モーダル制御
  // ============================================

  function open() {
    document.getElementById('kairos-dca-overlay').classList.add('open');

  function close() {
    document.getElementById('kairos-dca-overlay').classList.remove('open');
  }

  // ============================================
  // AI提案読み込み
  // ============================================

  let loadTimeout = null;

  async function loadSuggestion() {
    // デバウンス
    if (loadTimeout) clearTimeout(loadTimeout);
    loadTimeout = setTimeout(async () => {
      await _loadSuggestion();
    }, 500);
  }

  async function _loadSuggestion() {
    const container = document.getElementById('kairos-dca-suggestion');

    container.innerHTML = `
      <div class="kairos-dca-loading">
        <div class="kairos-dca-spinner"></div>
        <div class="kairos-dca-loading-text">AI分析中...</div>
      </div>
    `;

    // バックエンド確認
    if (!window.KAIROS?.Backend) {
      showError(container, 'バックエンドが利用できません');
      return;
    }

    const available = await window.KAIROS.Backend.healthCheck();
    if (!available) {
      showError(container, 'サーバーに接続できません。server.py を起動してください。');
      return;
    }

    try {
      const suggestion = await window.KAIROS.Backend.getMonthlySuggestion(currentBudget);
      if (!suggestion) {
        showError(container, '提案の取得に失敗しました');
        return;
      }

      currentSuggestion = suggestion;
      renderSuggestion(container, suggestion);
    } catch (e) {
      showError(container, 'エラー: ' + e.message);
    }
  }

  function showError(container, message) {
    container.innerHTML = `
      <div style="text-align: center; padding: 20px; color: #f87171;">
        ⚠️ ${message}
        <button class="kairos-dca-ai-refresh" onclick="window.KAIROS.DCASettings.reload()" style="display: block; margin: 12px auto 0;">
          🔄 再試行
        </button>
      </div>
    `;
  }

  function renderSuggestion(container, data) {
    const alloc = data.suggestion?.allocation_jpy || {};
    const allocPct = data.suggestion?.allocation_pct || {};
    const reasoning = data.suggestion?.reasoning || [];
    const scores = data.market_context?.scores || {};
    const sentiment = data.market_context?.overall_sentiment || 'Neutral';

    const currencies = [
      { id: 'btc', name: 'Bitcoin', icon: '₿', color: '#f7931a' },
      { id: 'eth', name: 'Ethereum', icon: 'Ξ', color: '#627eea' },
      { id: 'alt', name: 'Altcoin', icon: '◎', color: '#14f195' }
    ];

    let allocationHTML = '';
    currencies.forEach(c => {
      const jpy = alloc[c.id] || 0;
      const pct = Math.round((allocPct[c.id] || 0) * 100);
      const reason = reasoning.find(r => r.toLowerCase().includes(c.id)) || '';

      if (jpy > 0) {
        allocationHTML += `
          <div class="kairos-dca-allocation-item">
            <div class="kairos-dca-allocation-icon" style="color: ${c.color}">${c.icon}</div>
            <div class="kairos-dca-allocation-info">
              <div class="kairos-dca-allocation-name">${c.name}</div>
              <div class="kairos-dca-allocation-reason">${reason.split(':')[1]?.trim() || ''}</div>
            </div>
            <div class="kairos-dca-allocation-amount">
              <div class="kairos-dca-allocation-jpy">¥${jpy.toLocaleString()}</div>
              <div class="kairos-dca-allocation-pct">${pct}%</div>
            </div>
          </div>
        `;
      }
    });

    container.innerHTML = `
      <div class="kairos-dca-ai-header">
        <div class="kairos-dca-ai-icon">🤖</div>
        <div class="kairos-dca-ai-label">
          <div class="kairos-dca-ai-label-title">AI推奨配分</div>
          <div class="kairos-dca-ai-label-sub">市場状況: ${sentiment}</div>
        </div>
        <button class="kairos-dca-ai-refresh" onclick="window.KAIROS.DCASettings.reload()">🔄</button>
      </div>

      <div class="kairos-dca-allocation">
        ${allocationHTML}
      </div>

      <div class="kairos-dca-total">
        <span class="kairos-dca-total-label">合計</span>
        <span class="kairos-dca-total-value">¥${currentBudget.toLocaleString()}</span>
      </div>

      <div class="kairos-dca-market-context">
        <div class="kairos-dca-market-title">市場スコア</div>
        <div class="kairos-dca-market-scores">
          <div class="kairos-dca-market-score">
            <div class="kairos-dca-market-score-label">BTC</div>
            <div class="kairos-dca-market-score-value">${scores.btc || 50}</div>
          </div>
          <div class="kairos-dca-market-score">
            <div class="kairos-dca-market-score-label">ETH</div>
            <div class="kairos-dca-market-score-value">${scores.eth || 50}</div>
          </div>
          <div class="kairos-dca-market-score">
            <div class="kairos-dca-market-score-label">SOL</div>
            <div class="kairos-dca-market-score-value">${scores.sol || 50}</div>
          </div>
        </div>
      </div>
    `;
  }

  // ============================================
  // 保存
  // ============================================

  function save() {
    if (!currentSuggestion) {
      alert('AI提案を読み込んでから保存してください');
      return;
    }

    const settings = {
      budget: currentBudget,
      allocation: currentSuggestion.suggestion?.allocation_pct || {},
      lastUpdated: new Date().toISOString()
    };

    localStorage.setItem('kairos_dca_settings', JSON.stringify(settings));
    alert('設定を保存しました');
    close();
  }

  // ============================================
  // 初期化実行
  // ============================================

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // ============================================
  // グローバルAPI
  // ============================================

  window.KAIROS = window.KAIROS || {};
  window.KAIROS.DCASettings = {
    open: open,
    close: close,
    reload: loadSuggestion,
    getSuggestion: () => currentSuggestion,
    getBudget: () => currentBudget
  };

})();

</script>









<!-- KAIROS Mode System v7 -->
<script>
// ============================================
// KAIROS Mode System v7.0
// ============================================
// スワイプで切り替え
// - 左スワイプ → 短期モード
// - 右スワイプ → 長期モード
// - エッジインジケーター表示
// ============================================

(function() {
  'use strict';

  const THEMES = {
    core: {
      name: 'Core',
      label: '長期',
      edgeColor: '#a855f7', // 右端に表示（短期への誘導）
      colors: {
        '--mode-primary': '#10b981',
        '--mode-primary-glow': 'rgba(16, 185, 129, 0.3)',
        '--mode-bg': '#0a1628',
        '--mode-surface': '#0f1d32',
        '--mode-border': 'rgba(16, 185, 129, 0.2)',
        '--mode-text-primary': '#f0fdf4',
        '--mode-text-secondary': '#86efac',
      },
      scoreKey: 'long_term'
    },
    satellite: {
      name: 'Satellite',
      label: '短期',
      edgeColor: '#10b981', // 左端に表示（長期への誘導）
      colors: {
        '--mode-primary': '#a855f7',
        '--mode-primary-glow': 'rgba(168, 85, 247, 0.3)',
        '--mode-bg': '#0f0a1a',
        '--mode-surface': '#1a1025',
        '--mode-border': 'rgba(168, 85, 247, 0.2)',
        '--mode-text-primary': '#faf5ff',
        '--mode-text-secondary': '#d8b4fe',
      },
      scoreKey: 'short_term'
    }
  };

  const RANK_COLORS = {
    S: { bg: '#ffd700', text: '#000', glow: 'rgba(255,215,0,0.5)' },
    A: { bg: '#22c55e', text: '#fff', glow: 'rgba(34,197,94,0.3)' },
    B: { bg: '#3b82f6', text: '#fff', glow: 'rgba(59,130,246,0.3)' },
    C: { bg: '#8b5cf6', text: '#fff', glow: 'rgba(139,92,246,0.3)' },
    D: { bg: '#f59e0b', text: '#fff', glow: 'rgba(245,158,11,0.3)' },
    E: { bg: '#6b7280', text: '#fff', glow: 'none' }
  };

  const STORAGE_KEY = 'kairos_current_mode';
  let currentMode = localStorage.getItem(STORAGE_KEY) || 'core';
  let analysisCache = {};

  function getMode() { return currentMode; }

  function setMode(mode, animate = true) {
    console.log('[KAIROS] setMode called:', mode, 'current:', currentMode);
    if (!THEMES[mode] || mode === currentMode) {
      console.log('[KAIROS] setMode skipped (same mode or invalid)');
      return;
    }

    if (animate) {
      showTransition(mode);
    }

    currentMode = mode;
    localStorage.setItem(STORAGE_KEY, mode);
    applyTheme(mode);

    // モード切替時は強制的に再描画（doneマーカーをクリア）
    console.log('[KAIROS] Mode changed to:', mode, '- refreshing UI');
    clearDoneMarkers();
    replaceAllElements();
  }

  function clearDoneMarkers() {
    const elements = document.querySelectorAll('[data-kairos-ai="done"]');
    console.log('[KAIROS] Clearing', elements.length, 'done markers');
    elements.forEach(el => {
      delete el.dataset.kairosAi;
    });
    // キャッシュもクリアして新しいモードのスコアを取得
    analysisCache = {};
  }

  function toggleMode() {
    setMode(currentMode === 'core' ? 'satellite' : 'core');
  }

  function applyTheme(mode) {
    const theme = THEMES[mode];
    const root = document.documentElement;
    Object.entries(theme.colors).forEach(([key, value]) => {
      root.style.setProperty(key, value);
    });
    document.body.classList.remove('kairos-mode-core', 'kairos-mode-satellite');
    document.body.classList.add('kairos-mode-' + mode);
    updateEdgeIndicator(mode);
  }

  function desaturateColor(hexColor, confidence) {
    const saturationFactor = 0.3 + (confidence * 0.7);
    const hex = hexColor.replace('#', '');
    const r = parseInt(hex.substr(0, 2), 16);
    const g = parseInt(hex.substr(2, 2), 16);
    const b = parseInt(hex.substr(4, 2), 16);
    const gray = Math.round(r * 0.299 + g * 0.587 + b * 0.114);
    const newR = Math.round(gray + (r - gray) * saturationFactor);
    const newG = Math.round(gray + (g - gray) * saturationFactor);
    const newB = Math.round(gray + (b - gray) * saturationFactor);
    return `rgb(${newR}, ${newG}, ${newB})`;
  }

  // ============================================
  // スワイプ検出
  // ============================================

  let touchStartX = 0;
  let touchStartY = 0;
  let isSwiping = false;

  // スワイプを無効にする要素のセレクタ
  const SWIPE_IGNORE_SELECTORS = [
    'input',
    'textarea',
    'select',
    'button',
    '.slider',
    '.range',
    '[type="range"]',
    '.chart',
    '.recharts-wrapper',
    '.tradingview-widget',
    'canvas',
    '.color-picker',
    '.modal',
    '.dropdown',
    '.swiper',
    '.carousel',
    '[data-no-swipe]'
  ];

  function shouldIgnoreSwipe(target) {
    // 対象要素またはその親がスワイプ無効要素かチェック
    for (const selector of SWIPE_IGNORE_SELECTORS) {
      if (target.closest(selector)) {
        return true;
      }
    }
    return false;
  }

  function initSwipeDetection() {
    document.addEventListener('touchstart', (e) => {
      // スワイプ無効要素の場合はスキップ
      if (shouldIgnoreSwipe(e.target)) {
        isSwiping = false;
        return;
      }
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isSwiping = true;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!isSwiping) return;

      const touchX = e.touches[0].clientX;
      const touchY = e.touches[0].clientY;
      const diffX = touchX - touchStartX;
      const diffY = touchY - touchStartY;

      // 横スワイプのみ検出（縦スクロールを妨げない）
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
        showSwipeHint(diffX);
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (!isSwiping) return;
      isSwiping = false;

      const touchEndX = e.changedTouches[0].clientX;
      const diffX = touchEndX - touchStartX;
      const threshold = 80; // スワイプ判定の閾値

      hideSwipeHint();

      if (Math.abs(diffX) > threshold) {
        if (diffX < 0 && currentMode === 'core') {
          // 左スワイプ → 短期モードへ
          setMode('satellite');
        } else if (diffX > 0 && currentMode === 'satellite') {
          // 右スワイプ → 長期モードへ
          setMode('core');
        }
      }
    }, { passive: true });

    // マウスでも対応（PC用）
    let mouseStartX = 0;
    let isMouseDown = false;

    document.addEventListener('mousedown', (e) => {
      // スワイプ無効要素の場合はスキップ
      if (shouldIgnoreSwipe(e.target)) {
        isMouseDown = false;
        return;
      }
      mouseStartX = e.clientX;
      isMouseDown = true;
    });

    document.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      isMouseDown = false;

      const diffX = e.clientX - mouseStartX;
      const threshold = 100;

      hideSwipeHint();

      if (Math.abs(diffX) > threshold) {
        if (diffX < 0 && currentMode === 'core') {
          setMode('satellite');
        } else if (diffX > 0 && currentMode === 'satellite') {
          setMode('core');
        }
      }
    });
  }

  function createEdgeIndicator() {
    const existing = document.getElementById('kairos-edge-indicator');
    if (existing) existing.remove();

    const indicator = document.createElement('div');
    indicator.id = 'kairos-edge-indicator';
    document.body.appendChild(indicator);
    updateEdgeIndicator(currentMode);
  }

  function updateEdgeIndicator(mode) {
    const indicator = document.getElementById('kairos-edge-indicator');
    if (!indicator) return;

    if (mode === 'core') {
      // 長期モード: 右端に紫のライン（短期への誘導）
      indicator.className = 'kairos-edge kairos-edge-right';
      indicator.style.background = 'linear-gradient(to left, rgba(168,85,247,0.6), transparent)';
    } else {
      // 短期モード: 左端に緑のライン（長期への誘導）
      indicator.className = 'kairos-edge kairos-edge-left';
      indicator.style.background = 'linear-gradient(to right, rgba(16,185,129,0.6), transparent)';
    }

  // ============================================
  // 画面遷移エフェクト
  // ============================================

  function showTransition(toMode) {
    const overlay = document.createElement('div');
    overlay.className = 'kairos-transition-overlay';
    overlay.style.background = toMode === 'satellite'
      ? 'linear-gradient(135deg, #0f0a1a, #1a0f2e)'
      : 'linear-gradient(135deg, #0a1628, #0f2847)';

    const label = document.createElement('div');
    label.className = 'kairos-transition-label';
    label.innerHTML = `<span class="kairos-transition-icon">${THEMES[toMode].label === '短期' ? '⚡' : '🛡️'}</span><span>${THEMES[toMode].label}モード</span>`;
    overlay.appendChild(label);

    document.body.appendChild(overlay);

    // アニメーション
    requestAnimationFrame(() => {
      overlay.classList.add('active');
    });

    setTimeout(() => {
      overlay.classList.remove('active');
      setTimeout(() => overlay.remove(), 300);
    }, 400);
  }

  function showSwipeHint(diffX) {
    // 無効なスワイプ方向の場合は何もしない
    if ((diffX < 0 && currentMode === 'satellite') || (diffX > 0 && currentMode === 'core')) {
      hideSwipeHint();
      return;
    }

    const nextMode = diffX < 0 ? 'satellite' : 'core';
    const progress = Math.min(Math.abs(diffX) / 80, 1);

    // エッジプルエフェクト
    let pull = document.getElementById('kairos-edge-pull');
    if (!pull) {
      pull = document.createElement('div');
      pull.id = 'kairos-edge-pull';
      document.body.appendChild(pull);
    }

    const pullWidth = Math.min(progress * 60 + 4, 64); // 4px から最大64px
    const pullOpacity = 0.3 + progress * 0.5;

    if (diffX < 0) {
      // 左スワイプ → 右端から紫が引っ張られる
      pull.style.right = '0';
      pull.style.left = 'auto';
      pull.style.width = pullWidth + 'px';
      pull.style.background = `linear-gradient(to left, rgba(168,85,247,${pullOpacity}), transparent)`;
    } else {
      // 右スワイプ → 左端から緑が引っ張られる
      pull.style.left = '0';
      pull.style.right = 'auto';
      pull.style.width = pullWidth + 'px';
      pull.style.background = `linear-gradient(to right, rgba(16,185,129,${pullOpacity}), transparent)`;
    }
    pull.style.opacity = '1';

    // モード名ヒント
    let hint = document.getElementById('kairos-swipe-hint');
    if (!hint) {
      hint = document.createElement('div');
      hint.id = 'kairos-swipe-hint';
      document.body.appendChild(hint);
    }

    if (progress > 0.5) {
      hint.style.opacity = (progress - 0.5) * 2;
      hint.textContent = THEMES[nextMode].label;
      hint.style.left = diffX < 0 ? 'auto' : '20px';
      hint.style.right = diffX < 0 ? '20px' : 'auto';
    } else {
      hint.style.opacity = '0';
    }
  }

  function hideSwipeHint() {
    const hint = document.getElementById('kairos-swipe-hint');
    if (hint) hint.style.opacity = '0';

    const pull = document.getElementById('kairos-edge-pull');
    if (pull) {
      pull.style.opacity = '0';
      pull.style.width = '4px';
    }
  }

  async function updateMetricsContent(metricsBar) {
    // まず空状態の枠を表示
    metricsBar.innerHTML = `
      <div class="kairos-metric">
        <span class="kairos-metric-lbl">RANK</span>
        <div class="kairos-rank-row">
          <span class="kairos-rank-g kairos-empty">-</span>
          <span class="kairos-rank-s">--</span>
        </div>
      </div>
      <div class="kairos-metric">
        <span class="kairos-metric-lbl">PRICE</span>
        <span class="kairos-metric-val">--%</span>
      </div>
      <div class="kairos-metric">
        <span class="kairos-metric-lbl">信頼度</span>
        <span class="kairos-metric-val">--%</span>
      </div>
    `;

    if (!window.KAIROS?.Backend) return;

    const currencyId = getCurrentCurrencyId();
    if (!currencyId) return;

    try {
      const analysis = await getAnalysis(currencyId);
      if (!analysis) return;

      const headerUI = analysis.analysis?.header_ui || {};
      const rankBox = headerUI.rank_box || {};
      const confidenceBox = headerUI.confidence_box || {};
      const pricePos = headerUI.price_pos_box || {};

      // モード別データを取得（新仕様対応）
      const modeKey = currentMode === 'satellite' ? 'satellite' : 'core';
      const modeRank = rankBox[modeKey] || rankBox;  // 新仕様 or 後方互換
      const modeConfidence = confidenceBox[modeKey] || confidenceBox;

      const grade = modeRank.grade || rankBox.grade || 'C';
      const exactScore = modeRank.score || rankBox.score || 50;
      const confidence = modeConfidence.value || confidenceBox.value || 0.5;
      const confidencePct = Math.round(confidence * 100);
      const pricePosValue = pricePos.value || 50;

      console.log('[KAIROS Metrics] Mode:', modeKey, 'Grade:', grade, 'Score:', exactScore, 'Confidence:', confidencePct + '%');

      const rankColor = RANK_COLORS[grade] || RANK_COLORS.C;
      const displayBgColor = desaturateColor(rankColor.bg, confidence);
      const hasGlow = confidence >= 0.7;

      // ランクエフェクトクラスを決定
      let rankEffectClass = '';
      if (grade === 'S') {
        rankEffectClass = 'rank-great';  // Sランク - 強キラキラ
      } else if (grade === 'A') {
        rankEffectClass = 'rank-good';   // Aランク - キラキラ
      } else if (grade === 'E') {
        rankEffectClass = 'rank-danger'; // Eランク - 危険サイレン
      } else if (grade === 'D') {
        rankEffectClass = 'rank-warning'; // Dランク - 警告
      }

      metricsBar.innerHTML = `
        <div class="kairos-metric">
          <span class="kairos-metric-lbl">RANK</span>
          <div class="kairos-rank-row">
            <span class="kairos-rank-g ${rankEffectClass}" style="background:${displayBgColor};color:${rankColor.text};${hasGlow ? 'box-shadow:0 0 8px ' + rankColor.glow : ''}">${grade}</span>
            <span class="kairos-rank-s">${exactScore}</span>
          </div>
        </div>
        <div class="kairos-metric">
          <span class="kairos-metric-lbl">PRICE</span>
          <span class="kairos-metric-val">${pricePosValue}%</span>
        </div>
        <div class="kairos-metric">
          <span class="kairos-metric-lbl">信頼度</span>
          <span class="kairos-metric-val">${confidencePct}%</span>
        </div>
      `;

      // Sランクにキラキラ粒子を追加
      if (grade === 'S') {
        const rankEl = metricsBar.querySelector('.kairos-rank-g');
        if (rankEl) addSparkleParticles(rankEl, 5, 'sparkle-particle');
      }
    } catch (e) {
      console.error('[KAIROS] Metrics error:', e);
    }
  }

  // キラキラ粒子を追加するヘルパー関数
  function addSparkleParticles(element, count, className) {
    for (let i = 0; i < count; i++) {
      const particle = document.createElement('span');
      particle.className = className;
      particle.textContent = '✦';
      element.appendChild(particle);
    }
  }

  // アクション別のバー色定義（グラデーション: 緑→青→グレー→黄→オレンジ→赤）
  const ACTION_COLORS = {
    // 最良（濃い緑）
    'strong buy': '#15803d',      // 濃い緑
    'strong accumulate': '#15803d',
    'strong long': '#15803d',
    // 良い（緑）
    'buy': '#22c55e',             // 緑
    'accumulate': '#22c55e',
    'long': '#22c55e',
    // やや良い（エメラルド）
    'light accumulate': '#10b981', // エメラルド
    'scale in': '#10b981',
    // 中立良（シアン/青緑）
    'hold': '#06b6d4',            // シアン
    // 中立（青）
    'neutral': '#3b82f6',         // 青
    'wait': '#6b7280',            // グレー
    'wait for breakout': '#6b7280',
    // やや注意（黄色）
    'caution': '#eab308',         // 黄色
    'scale out': '#eab308',
    // 注意（オレンジ）
    'reduce': '#f59e0b',          // オレンジ
    'take profit': '#f59e0b',
    // 危険（赤）
    'sell': '#f87171',            // 赤
    'short': '#f87171',
    // 最危険（濃い赤）
    'strong sell': '#dc2626',     // 濃い赤
    'strong short': '#dc2626',
    'exit': '#dc2626',
  };

  function getBarColor(action) {
    const lowerAction = action.toLowerCase();
    for (const [key, color] of Object.entries(ACTION_COLORS)) {
      if (lowerAction.includes(key) || lowerAction === key) {
        return color;
      }
    }
    return '#6b7280'; // デフォルトはグレー
  }

  async function updateGaugeContent(gauge) {
    const theme = THEMES[currentMode];

    // まず空状態の枠を表示
    gauge.innerHTML = `
      <div class="kairos-gauge">
        <span class="kairos-gauge-lbl">${theme.label}</span>
        <div class="kairos-gauge-track">
          <div class="kairos-gauge-bar" style="width:0%;background:#6b7280"></div>
        </div>
        <span class="kairos-gauge-val">--</span>
        <span class="kairos-gauge-act kairos-empty">---</span>
      </div>
    `;

    if (!window.KAIROS?.Backend) {
      console.log('[KAIROS Gauge] No backend');
      return;
    }
    const currencyId = getCurrentCurrencyId();
    if (!currencyId) {
      console.log('[KAIROS Gauge] No currencyId');
      return;
    }

    try {
      const analysis = await getAnalysis(currencyId);
      if (!analysis) {
        console.log('[KAIROS Gauge] No analysis');
        return;
      }

      const scoreBars = analysis.analysis?.score_bars || {};
      const scoreData = scoreBars[theme.scoreKey] || {};
      const score = scoreData.score || 50;
      const action = scoreData.action || 'Hold';

      console.log('[KAIROS Gauge] Mode:', currentMode, 'ScoreKey:', theme.scoreKey, 'Score:', score, 'Action:', action);
      const lowerAction = action.toLowerCase();
      let actionClass = 'hold';
      if (lowerAction.includes('strong buy') || lowerAction.includes('strong long')) {
        actionClass = 'buy';
      } else if (lowerAction.includes('buy') || lowerAction.includes('long')) {
        actionClass = 'buy';
      } else if (lowerAction.includes('accumulate')) {
        actionClass = 'accumulate';
      } else if (lowerAction.includes('hold')) {
        actionClass = 'hold';
      } else if (lowerAction.includes('wait') || lowerAction.includes('neutral')) {
        actionClass = 'wait';
      } else if (lowerAction.includes('reduce') || lowerAction.includes('caution') || lowerAction.includes('scale out')) {
        actionClass = 'caution';
      } else if (lowerAction.includes('sell') || lowerAction.includes('short') || lowerAction.includes('exit')) {
        actionClass = 'sell';
      }
      const longTextClass = action.length > 10 ? 'long-text' : '';
      const barColor = getBarColor(action);

      // バー効果クラスを決定
      let barEffectClass = '';
      if (lowerAction.includes('strong buy') || lowerAction.includes('strong long') || lowerAction.includes('strong accumulate')) {
        barEffectClass = 'bar-great';  // 濃い緑 - 強いキラキラ
      } else if (!lowerAction.includes('light') && (lowerAction.includes('buy') || lowerAction.includes('long') || lowerAction.includes('accumulate'))) {
        barEffectClass = 'bar-good';   // 緑 - キラキラ (Light Accumulateは除外)
      } else if (lowerAction.includes('strong sell') || lowerAction.includes('strong short') || lowerAction.includes('exit')) {
        barEffectClass = 'bar-danger'; // 濃い赤 - 危険パルス
      } else if (lowerAction.includes('sell') || lowerAction.includes('short') || lowerAction.includes('reduce')) {
        barEffectClass = 'bar-warning'; // 赤 - 警告パルス
      }

      // 枠を先に描画してからバーをアニメーション
      gauge.innerHTML = `
        <div class="kairos-gauge">
          <span class="kairos-gauge-lbl">${theme.label}</span>
          <div class="kairos-gauge-track">
            <div class="kairos-gauge-bar kairos-animate ${barEffectClass}" style="width:0%;background:${barColor}"></div>
          </div>
          <span class="kairos-gauge-val">${score}</span>
          <span class="kairos-gauge-act ${actionClass} ${longTextClass}">${action}</span>
        </div>
      `;

      // 少し遅延させてからバーを伸ばす（アニメーション効果）
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const bar = gauge.querySelector('.kairos-gauge-bar');
          if (bar) {
            bar.style.width = score + '%';
            // Strong Buy等にキラキラ粒子を追加
            if (barEffectClass === 'bar-great') {
              addSparkleParticles(bar, 6, 'bar-sparkle');
            }
          }
        });
      });

    } catch (e) {
      console.error('[KAIROS] Gauge error:', e);
    }
  }

  function getCurrentCurrencyId() {
    const currencyEl = document.querySelector('.detail__currency-name-compact, .detail__currency-name');
    if (!currencyEl) return null;
    const name = currencyEl.textContent.trim();
    const map = { 'Bitcoin': 'btc', 'BTC': 'btc', 'Ethereum': 'eth', 'ETH': 'eth', 'Solana': 'sol', 'SOL': 'sol', 'Ripple': 'xrp', 'XRP': 'xrp', 'Cardano': 'ada', 'ADA': 'ada' };
    return map[name] || 'btc';
  }

  async function getAnalysis(currencyId) {
    const cached = analysisCache[currencyId];
    if (cached && cached.data && Date.now() - cached.timestamp < 5 * 60 * 1000) {
      console.log('[KAIROS] Using cached analysis for:', currencyId);
      return cached.data;
    }

    // まずkairosDataから直接取得を試みる（最速）
    if (window.kairosData) {
      const upperCurrency = currencyId.toUpperCase();
      let data = null;

      if (window.kairosData.all_results) {
        data = window.kairosData.all_results.find(r => r.ticker === upperCurrency);
      }
      if (!data && window.kairosData.ticker === upperCurrency) {
        data = window.kairosData;
      }

      if (data) {
        console.log('[KAIROS] Using kairosData for:', upperCurrency, data);
        analysisCache[currencyId] = { data: data, timestamp: Date.now() };
        return data;
      }
    }

    // バックエンドAPIを試みる
    const available = await window.KAIROS.Backend.healthCheck();
    if (!available) {
      console.warn('[KAIROS] No backend and no kairosData available');
      return null;
    }

    const analysis = await window.KAIROS.Backend.analyzeCurrency(currencyId);
    if (analysis) {
      analysisCache[currencyId] = { data: analysis, timestamp: Date.now() };
    }
    return analysis;
  }
