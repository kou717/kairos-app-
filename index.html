<body>
  <div id="root"></div>

  <!-- KAIROS Vanilla App -->
  <script src="kairos-vanilla-app.js?v=19.29"></script>

  <!-- KAIROS Features & Backend Integration -->
  <script>
  // KAIROS Features
  window.KAIROS = window.KAIROS || {};
  window.KAIROS.Features = {
    showToast: function(message, type, duration) {
      // 改良版トーストを使用
      if (window.KairosUI && window.KairosUI.showToast) {
        window.KairosUI.showToast(message, type, duration);
      } else {
        // フォールバック
        console.log('[Toast]', type, message);
        var toast = document.createElement('div');
        var bgColor = type === 'success' ? 'rgba(16,185,129,0.9)' : type === 'error' ? 'rgba(248,113,113,0.9)' : 'rgba(26,26,46,0.95)';
        toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:' + bgColor + ';color:#fff;padding:12px 24px;border-radius:12px;z-index:10000;border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(10px);font-size:14px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,0.3);';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 2500);
      }
    },
    openPortfolio: function() {
      if (window.openPortfolioModal) window.openPortfolioModal();
    },
    openAccumulationSettings: function() {
      if (window.openDCAModal) window.openDCAModal();
    },
    openFireSettings: function() {
      if (window.openSettingsModal) window.openSettingsModal();
    }
  };

  // Mode system
  window.setMode = function(mode) {
    console.log('[Mode]', mode);
    document.body.className = 'kairos-mode-' + mode;
  };

  // バックエンドからリアルタイムデータを取得
  (function() {
    var BACKEND_URL = 'http://localhost:8000';

    function fetchBackendData() {
      // ヘルスチェック
      fetch(BACKEND_URL + '/')
        .then(function(res) { return res.json(); })
        .then(function(health) {
          console.log('[KAIROS] Backend connected:', health.version);

          // BTC分析データを取得
          return fetch(BACKEND_URL + '/api/analyze/BTC');
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          // kairosDataを更新
          window.kairosData = Object.assign(window.kairosData || {}, data);
          console.log('[KAIROS] Live data loaded:', data.ticker, '$' + data.current_price);

          // 画面を更新
          if (window.KairosApp && window.KairosApp.refresh) {
            window.KairosApp.refresh();
          }
        })
        .catch(function(err) {
          console.log('[KAIROS] Backend not available, using fallback data');
        });
    }

    // ページ読み込み後にデータ取得
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(fetchBackendData, 500);
      });
    } else {
      setTimeout(fetchBackendData, 500);
    }
  })();

  // Service Worker登録（?nosw で無効化）
  if ('serviceWorker' in navigator) {
    if (location.search.includes('nosw')) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) { reg.unregister(); });
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
        console.log('[KAIROS] SW unregistered & caches cleared');
        if (location.search === '?nosw') {
          location.replace(location.pathname);
        }
      });
    } else {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js')
        .then(function(registration) {
          console.log('[KAIROS] Service Worker registered:', registration.scope);

          // 更新チェック
          registration.addEventListener('updatefound', function() {
            var newWorker = registration.installing;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // 新しいバージョンが利用可能
                if (window.KairosUI && window.KairosUI.showToast) {
                  window.KairosUI.showToast('新しいバージョンが利用可能です。再読み込みしてください。', 'info', 5000);
                }
              }
            });
          });
        })
        .catch(function(error) {
          console.log('[KAIROS] Service Worker registration failed:', error);
        });
    });
    }
  }
  </script>
